# Starter workflow — CI backend Java/Quarkus
# Copiado para <produto>/.github/workflows/ no bootstrap.
# A lógica de build real vive em platform (reusable workflow).
name: CI Backend (Quarkus)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  call-platform:
    uses: fbso-techservice/platform/.github/workflows/build-java-quarkus.yml@main
    with:
      java-version: "25"
